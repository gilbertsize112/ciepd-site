<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function(){
            const t=localStorage.getItem('theme');
            const d=t==='dark'||(!t&&window.matchMedia('(prefers-color-scheme: dark)').matches);
            if(d) document.documentElement.classList.add('dark');
        })();
    </script>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <title>CIEPD Intelligence Portal | Secure Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">

    <style>
/* ================================================================
   CIEPD COMMAND INTELLIGENCE — DESIGN SYSTEM v4.0 — LOGIN PAGE
================================================================ */

:root {
    --void:#04060a; --deep:#080c14; --dark:#0c1220; --mid:#121a2e;
    --surface:#18223a; --lift:#1e2d48; --raised:#243354;
    --g0:rgba(255,255,255,0.02); --g1:rgba(255,255,255,0.04);
    --g2:rgba(255,255,255,0.07); --g3:rgba(255,255,255,0.11); --g4:rgba(255,255,255,0.16);
    --b0:rgba(255,255,255,0.04); --b1:rgba(255,255,255,0.08);
    --b2:rgba(255,255,255,0.14); --b3:rgba(255,255,255,0.22); --b4:rgba(255,255,255,0.32);
    --cyan:#00f0ff; --cyan-60:rgba(0,240,255,0.60); --cyan-40:rgba(0,240,255,0.40);
    --cyan-20:rgba(0,240,255,0.20); --cyan-10:rgba(0,240,255,0.10); --cyan-05:rgba(0,240,255,0.05);
    --cyan-glow:0 0 28px rgba(0,240,255,0.35);
    --cyan-glow-xl:0 0 60px rgba(0,240,255,0.25),0 0 120px rgba(0,240,255,0.10);
    --indigo:#6366f1; --indigo-dim:rgba(99,102,241,0.20);
    --emerald:#10ffb0; --emerald-dim:rgba(16,255,176,0.12); --emerald-border:rgba(16,255,176,0.25);
    --crimson:#ff1a4b; --crimson-dim:rgba(255,26,75,0.12); --crimson-border:rgba(255,26,75,0.28);
    --amber:#ffb020; --amber-dim:rgba(255,176,32,0.12);
    --violet:#bf5af2;
    --tx1:#f0f6ff; --tx2:#8896b0; --tx3:#4a5a78; --tx4:#283048; --tx-inv:#040610;
    --f-disp:'Syne',sans-serif; --f-body:'DM Sans',sans-serif; --f-mono:'JetBrains Mono',monospace;
    --ease:cubic-bezier(0.16,1,0.3,1); --spring:cubic-bezier(0.34,1.56,0.64,1);
    --card-bg:rgba(8,12,20,0.90);
    --input-bg:rgba(255,255,255,0.04); --input-focus-bg:rgba(255,255,255,0.07);
}

html:not(.dark) {
    --void:#e8eef8; --deep:#dde6f4; --dark:#d2dcf0; --mid:#c8d4ec;
    --surface:#f4f7fd; --lift:#ffffff; --raised:#ffffff;
    --g0:rgba(0,60,140,0.015); --g1:rgba(0,60,140,0.035);
    --g2:rgba(0,60,140,0.065); --g3:rgba(0,60,140,0.10); --g4:rgba(0,60,140,0.14);
    --b0:rgba(0,50,120,0.04); --b1:rgba(0,50,120,0.09);
    --b2:rgba(0,50,120,0.16); --b3:rgba(0,50,120,0.24); --b4:rgba(0,50,120,0.36);
    --cyan:#005bcc; --cyan-60:rgba(0,91,204,0.60); --cyan-40:rgba(0,91,204,0.40);
    --cyan-20:rgba(0,91,204,0.20); --cyan-10:rgba(0,91,204,0.10); --cyan-05:rgba(0,91,204,0.05);
    --cyan-glow:0 0 20px rgba(0,91,204,0.18); --cyan-glow-xl:0 0 36px rgba(0,91,204,0.22);
    --indigo:#4f46e5; --indigo-dim:rgba(79,70,229,0.10);
    --emerald:#00916e; --emerald-dim:rgba(0,145,110,0.10); --emerald-border:rgba(0,145,110,0.25);
    --crimson:#c8003d; --crimson-dim:rgba(200,0,61,0.10); --crimson-border:rgba(200,0,61,0.28);
    --amber:#b45a00; --amber-dim:rgba(180,90,0,0.10);
    --violet:#7c3aed;
    --tx1:#0a1020; --tx2:#3a4f6e; --tx3:#7088aa; --tx4:#a8bcd8; --tx-inv:#f0f6ff;
    --card-bg:rgba(255,255,255,0.96);
    --input-bg:rgba(0,50,120,0.035); --input-focus-bg:rgba(0,50,120,0.06);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { font-size:16px; -webkit-font-smoothing:antialiased; height:100%; }

body {
    font-family:var(--f-body);
    background:var(--void); color:var(--tx1);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative;
    padding:20px 16px;
    transition:background 0.4s,color 0.4s;
}

/* ── MATRIX RAIN CANVAS ─────────────────────────────── */
#matrix-canvas {
    position:fixed; inset:0; z-index:1;
    pointer-events:none; opacity:0.055;
}
html:not(.dark) #matrix-canvas { opacity:0.025; }

/* ── SCAN LINE ──────────────────────────────────────── */
#scan-line {
    position:fixed; left:0; right:0; height:2px; z-index:2;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,0.4),transparent);
    animation:scan-sweep 5s linear infinite;
    pointer-events:none;
    box-shadow:0 0 12px rgba(0,240,255,0.3);
}
html:not(.dark) #scan-line { background:linear-gradient(90deg,transparent,rgba(0,91,204,0.25),transparent); }
@keyframes scan-sweep {
    0%   { top:-2px; opacity:0; }
    5%   { opacity:1; }
    95%  { opacity:1; }
    100% { top:100vh; opacity:0; }
}

/* ── BACKGROUND ───────────────────────────────────────────── */
#bg-canvas { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
#bg-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.18; filter:saturate(0.4) brightness(0.35); }
html:not(.dark) #bg-video { opacity:0.06; filter:saturate(0.2) brightness(0.8); }
#bg-scanlines { position:absolute; inset:0; z-index:2; pointer-events:none; background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,0.025) 3px,rgba(0,0,0,0.025) 4px); }
#bg-grid { position:absolute; inset:-200px; z-index:1; background-image:linear-gradient(rgba(0,240,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.025) 1px,transparent 1px); background-size:64px 64px; animation:grid-drift 90s linear infinite; }
html:not(.dark) #bg-grid { background-image:linear-gradient(rgba(0,91,204,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,91,204,0.04) 1px,transparent 1px); }
@keyframes grid-drift { to { transform:translate(64px,64px); } }
.bg-orb { position:absolute; border-radius:50%; filter:blur(140px); pointer-events:none; z-index:0; animation:orb-drift 28s ease-in-out infinite alternate; }
html:not(.dark) .bg-orb { opacity:0.06 !important; }
.bg-orb.o1 { width:800px;height:800px;background:var(--cyan);   top:-320px;left:-280px; opacity:0.11;animation-duration:32s; }
.bg-orb.o2 { width:600px;height:600px;background:var(--violet); bottom:-240px;right:-220px; opacity:0.09;animation-duration:26s;animation-delay:-14s; }
.bg-orb.o3 { width:440px;height:440px;background:var(--emerald);top:45%;left:58%; opacity:0.07;animation-duration:20s;animation-delay:-7s; }
@keyframes orb-drift { 0%{transform:translate(0,0) scale(1);}50%{transform:translate(60px,-80px) scale(1.08);}100%{transform:translate(-40px,50px) scale(0.96);} }
#bg-vignette { position:absolute; inset:0; pointer-events:none; z-index:3; background:radial-gradient(ellipse at center,transparent 20%,rgba(4,6,10,0.70) 100%); }
html:not(.dark) #bg-vignette { background:radial-gradient(ellipse at center,transparent 20%,rgba(180,200,240,0.45) 100%); }

/* corner brackets */
.corner { position:fixed; width:36px; height:36px; pointer-events:none; z-index:5; opacity:0.18; }
.corner::before,.corner::after { content:''; position:absolute; background:var(--cyan); border-radius:2px; }
.corner::before { width:2px; height:100%; } .corner::after { width:100%; height:2px; }
.corner.tl { top:12px;left:12px; }  .corner.tl::before,.corner.tl::after { top:0;left:0; }
.corner.tr { top:12px;right:12px; } .corner.tr::before { top:0;right:0; } .corner.tr::after { top:0;right:0; }
.corner.bl { bottom:12px;left:12px; }  .corner.bl::before { bottom:0;left:0; } .corner.bl::after { bottom:0;left:0; }
.corner.br { bottom:12px;right:12px; } .corner.br::before { bottom:0;right:0; } .corner.br::after { bottom:0;right:0; }

/* ── TOP NAV BAR ────────────────────────────────────── */
#top-nav {
    position:fixed; top:0; left:0; right:0; z-index:300;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 18px;
    background:rgba(4,6,10,0.70);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--b1);
    animation:nav-drop 0.6s var(--ease) both;
}
html:not(.dark) #top-nav { background:rgba(238,243,255,0.80); }
@keyframes nav-drop { from{transform:translateY(-100%);opacity:0;} to{transform:translateY(0);opacity:1;} }

.nav-home-btn {
    display:flex; align-items:center; gap:8px;
    padding:8px 16px;
    background:var(--g2); border:1px solid var(--b2); border-radius:10px;
    color:var(--tx2); font-family:var(--f-body); font-size:0.78rem; font-weight:700;
    text-decoration:none; letter-spacing:0.02em; text-transform:uppercase;
    transition:all 0.22s var(--ease); position:relative; overflow:hidden;
}
.nav-home-btn::before {
    content:''; position:absolute; inset:0;
    background:var(--cyan); transform:scaleX(0); transform-origin:left;
    transition:transform 0.3s var(--ease);
}
.nav-home-btn:hover::before { transform:scaleX(1); }
.nav-home-btn:hover { color:var(--tx-inv); border-color:var(--cyan); transform:translateY(-2px); box-shadow:var(--cyan-glow); }
.nav-home-btn span, .nav-home-btn i { position:relative; z-index:1; }
.nav-home-btn i { font-size:13px; }

.nav-right { display:flex; align-items:center; gap:8px; }

#themeBtn {
    width:38px; height:38px; border-radius:10px;
    border:1px solid var(--b2); background:var(--g1);
    color:var(--tx2); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:all 0.25s var(--ease);
}
#themeBtn:hover { background:var(--g3); border-color:var(--cyan-20); color:var(--cyan); transform:rotate(20deg) scale(1.1); }

.nav-status-pill {
    display:flex; align-items:center; gap:6px;
    padding:6px 12px;
    background:var(--emerald-dim); border:1px solid var(--emerald-border);
    border-radius:99px; font-family:var(--f-mono); font-size:0.58rem; font-weight:700;
    color:var(--emerald); letter-spacing:0.08em; text-transform:uppercase;
}
.nav-status-dot { width:5px;height:5px;background:var(--emerald);border-radius:50%;box-shadow:0 0 6px var(--emerald);animation:dot-blink 2s ease-in-out infinite; }
@keyframes dot-blink { 0%,100%{transform:scale(1);}50%{transform:scale(0.4);opacity:0.4;} }

/* ── PAGE WRAP ────────────────────────────────────────────── */
#page-wrap {
    position:relative; z-index:10;
    width:100%; max-width:468px;
    margin-top:30px;
    animation:wrap-rise 0.9s var(--spring) 0.2s both;
}
@keyframes wrap-rise { from{opacity:0;transform:translateY(50px) scale(0.94);}to{opacity:1;transform:translateY(0) scale(1);} }

/* ── IDENTITY BAR ─────────────────────────────────────────── */
.identity-bar {
    display:flex; align-items:center; justify-content:center;
    gap:16px; margin-bottom:26px;
}

/* Logo with biometric scan ring */
.id-logo-wrap {
    position:relative; width:64px; height:64px; flex-shrink:0;
}
.id-logo-img {
    width:64px; height:64px;
    border-radius:16px;
    overflow:hidden;
    border:2px solid var(--cyan-40);
    box-shadow:var(--cyan-glow);
    position:relative; z-index:2;
    animation:logo-pulse 3s ease-in-out infinite;
    background:rgba(0,240,255,0.04);
    display:flex; align-items:center; justify-content:center;
}
.id-logo-img img { width:100%; height:100%; object-fit:contain; display:block; }
@keyframes logo-pulse { 0%,100%{box-shadow:var(--cyan-glow);}50%{box-shadow:var(--cyan-glow-xl);} }

/* rotating scan ring */
.scan-ring {
    position:absolute; inset:-8px; border-radius:24px; z-index:1;
    border:1.5px solid transparent;
    background:linear-gradient(var(--void),var(--void)) padding-box,
               conic-gradient(from 0deg, var(--cyan), var(--indigo), transparent 60%, var(--cyan)) border-box;
    animation:ring-spin 3s linear infinite;
}
@keyframes ring-spin { to { transform:rotate(360deg); } }

/* corner scan dots */
.scan-dot {
    position:absolute; width:5px; height:5px; border-radius:50%;
    background:var(--cyan); box-shadow:0 0 6px var(--cyan);
    animation:scan-dot-blink 1.8s ease-in-out infinite;
    z-index:3;
}
.scan-dot.tl { top:-2px; left:-2px; animation-delay:0s; }
.scan-dot.tr { top:-2px; right:-2px; animation-delay:0.45s; }
.scan-dot.bl { bottom:-2px; left:-2px; animation-delay:0.9s; }
.scan-dot.br { bottom:-2px; right:-2px; animation-delay:1.35s; }
@keyframes scan-dot-blink { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.2;transform:scale(0.5);} }

.id-name {
    font-family:var(--f-disp); font-size:1.55rem; font-weight:800;
    color:var(--tx1); letter-spacing:0.07em; text-transform:uppercase; line-height:1;
    animation:glitch-name 8s infinite;
}
@keyframes glitch-name {
    0%,94%,100% { text-shadow:none; transform:none; }
    95% { text-shadow:-2px 0 var(--crimson), 2px 0 var(--cyan); transform:skew(-1deg); }
    96% { text-shadow:2px 0 var(--crimson), -2px 0 var(--cyan); transform:skew(1deg); }
    97% { text-shadow:none; transform:none; }
    98% { text-shadow:-1px 0 var(--cyan); transform:skew(-0.5deg); }
}
.id-tagline {
    font-family:var(--f-mono); font-size:0.58rem; font-weight:500;
    color:var(--cyan); letter-spacing:0.17em; text-transform:uppercase; margin-top:4px;
}

/* ── GLASS CARD ───────────────────────────────────────────── */
.glass-card {
    width:100%;
    background:var(--card-bg);
    backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
    border:1px solid var(--b2); border-radius:28px;
    box-shadow:0 32px 80px rgba(0,0,0,0.65),0 0 0 1px rgba(255,255,255,0.03),inset 0 1px 0 rgba(255,255,255,0.05);
    overflow:hidden; position:relative;
}
html:not(.dark) .glass-card { box-shadow:0 24px 60px rgba(0,0,0,0.12),0 0 0 1px rgba(0,50,120,0.04); }

/* scanline overlay on card */
.glass-card::before {
    content:''; position:absolute; inset:0; z-index:0; pointer-events:none; border-radius:28px;
    background:repeating-linear-gradient(0deg,transparent 0px,transparent 5px,rgba(0,240,255,0.006) 5px,rgba(0,240,255,0.006) 6px);
}

/* animated top accent bar */
.card-accent {
    height:3px; position:relative; z-index:2;
    background:linear-gradient(90deg,var(--cyan),var(--indigo),var(--violet),transparent);
    opacity:0.85;
    animation:accent-flow 4s linear infinite;
    background-size:200% 100%;
}
@keyframes accent-flow {
    0%   { background-position:0% 0; }
    100% { background-position:200% 0; }
}

.card-body { padding:36px 40px 38px; position:relative; z-index:2; }

/* ── CLEARANCE HEADER ───────────────────────────────────── */
.clearance-header {
    text-align:center; margin-bottom:28px;
}
.clearance-badge {
    display:inline-flex; align-items:center; gap:8px;
    padding:5px 14px;
    background:var(--crimson-dim); border:1px solid var(--crimson-border);
    border-radius:6px;
    font-family:var(--f-mono); font-size:0.55rem; font-weight:800;
    color:var(--crimson); letter-spacing:0.16em; text-transform:uppercase;
    margin-bottom:10px;
    animation:badge-flicker 6s infinite;
}
.clearance-badge-dot { width:5px;height:5px;background:var(--crimson);border-radius:50%;box-shadow:0 0 5px var(--crimson);animation:dot-blink 0.9s ease-in-out infinite; }
@keyframes badge-flicker {
    0%,89%,100% { opacity:1; }
    90%  { opacity:0.3; }
    91%  { opacity:1; }
    93%  { opacity:0.4; }
    94%  { opacity:1; }
}
.clearance-title {
    font-family:var(--f-disp); font-size:1.25rem; font-weight:800;
    color:var(--tx1); letter-spacing:0.04em; margin-bottom:4px;
}
.clearance-sub {
    font-family:var(--f-mono); font-size:0.60rem; color:var(--tx3);
    letter-spacing:0.1em; text-transform:uppercase;
}

/* ── SYSTEM STATUS PILL ───────────────────────────────────── */
.sys-pill {
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:0 auto 28px; width:fit-content;
    padding:8px 18px;
    background:var(--emerald-dim); border:1px solid var(--emerald-border);
    border-radius:99px;
    font-family:var(--f-mono); font-size:0.60rem; font-weight:700;
    color:var(--emerald); letter-spacing:0.10em; text-transform:uppercase;
}
.sys-dot {
    width:6px; height:6px; flex-shrink:0;
    background:var(--emerald); border-radius:50%; box-shadow:0 0 8px var(--emerald);
    animation:dot-blink 2.2s ease-in-out infinite;
}

/* ── MESSAGE BOX ──────────────────────────────────────────── */
#message-box {
    display:none; align-items:center; gap:10px;
    padding:12px 16px; border-radius:12px;
    font-family:var(--f-body); font-size:0.82rem; font-weight:600;
    margin-bottom:22px; border:1px solid transparent;
}
#message-box.show { display:flex; animation:msg-appear 0.3s var(--ease) both; }
@keyframes msg-appear { from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);} }
#message-box.msg-success { background:var(--emerald-dim); border-color:var(--emerald-border); color:var(--emerald); }
#message-box.msg-error   { background:var(--crimson-dim); border-color:var(--crimson-border); color:var(--crimson); }
#msg-icon { font-size:14px; flex-shrink:0; }

/* ── LOGIN FORM ───────────────────────────────────────────── */
.input-group { margin-bottom:18px; }
.input-group label {
    display:block; margin-bottom:7px;
    font-family:var(--f-mono); font-size:0.60rem; font-weight:700;
    color:var(--tx3); text-transform:uppercase; letter-spacing:0.12em;
    display:flex; align-items:center; gap:6px;
}
.input-group label .lbl-line {
    flex:1; height:1px; background:var(--b1); border-radius:1px;
}
.input-wrapper { position:relative; display:flex; align-items:center; }
.input-wrapper .ico {
    position:absolute; left:15px;
    color:var(--tx3); font-size:13px; pointer-events:none;
    transition:color 0.2s;
}
.input-wrapper input {
    width:100%; padding:13px 44px 13px 44px;
    background:var(--input-bg); border:1px solid var(--b2); border-radius:12px;
    font-family:var(--f-body); font-size:0.90rem;
    color:var(--tx1); outline:none;
    transition:all 0.22s var(--ease); -webkit-appearance:none;
}
.input-wrapper input::placeholder { color:var(--tx3); }
.input-wrapper input:focus {
    background:var(--input-focus-bg); border-color:var(--cyan);
    box-shadow:0 0 0 3px var(--cyan-10);
}
.input-wrapper:focus-within .ico { color:var(--cyan); }

/* password eye */
.pw-eye {
    position:absolute; right:14px; padding:4px;
    color:var(--tx3); font-size:12px;
    cursor:pointer; transition:color 0.2s;
}
.pw-eye:hover { color:var(--tx2); }

/* input focus typing effect border */
.input-wrapper input:focus {
    background:var(--input-focus-bg); border-color:var(--cyan);
    box-shadow:0 0 0 3px var(--cyan-10);
    animation:input-pulse 2s ease-in-out infinite;
}
@keyframes input-pulse {
    0%,100% { box-shadow:0 0 0 3px var(--cyan-10); }
    50%     { box-shadow:0 0 0 5px rgba(0,240,255,0.06); }
}

/* ── SUBMIT BUTTON ───────────────────────────────────────── */
.btn-submit {
    width:100%; margin-top:24px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    padding:16px 20px; border:none; border-radius:12px;
    font-family:var(--f-disp); font-size:0.9rem;
    font-weight:800; text-transform:uppercase; letter-spacing:0.10em;
    cursor:pointer; transition:all 0.25s var(--ease);
    position:relative; overflow:hidden;
    background:linear-gradient(135deg,var(--cyan),#00c8d8); color:var(--tx-inv);
    box-shadow:0 4px 20px var(--cyan-20);
}
html:not(.dark) .btn-submit { color:#fff; }
.btn-submit::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);
    transform:translateX(-100%);
    transition:transform 0.5s var(--ease);
}
.btn-submit:hover::before { transform:translateX(100%); }
.btn-submit::after { content:''; position:absolute; inset:0; background:rgba(255,255,255,0.09); opacity:0; transition:opacity 0.2s; }
.btn-submit:hover::after { opacity:1; }
.btn-submit:hover { transform:translateY(-3px); box-shadow:0 8px 32px var(--cyan-40); }
.btn-submit:active { transform:translateY(-1px); }
.btn-submit:disabled { opacity:0.38; pointer-events:none; }

/* ── FORGOT / HELP ROW ──────────────────────────────────── */
.help-row {
    display:flex; align-items:center; justify-content:center;
    margin-top:16px; gap:6px;
    font-family:var(--f-mono); font-size:0.58rem; color:var(--tx3);
    letter-spacing:0.06em;
}
.help-row i { color:var(--amber); font-size:10px; }

/* ── CARD FOOTER ──────────────────────────────────────────── */
.card-footer {
    position:relative; z-index:2;
    border-top:1px solid var(--b1); padding:18px 40px 20px;
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; flex-wrap:wrap;
}
.ft-item {
    display:flex; align-items:center; gap:7px;
    font-family:var(--f-mono); font-size:0.59rem; font-weight:600;
    color:var(--tx3); text-transform:uppercase; letter-spacing:0.07em;
}
.ft-item i { font-size:11px; color:var(--cyan); }
.emergency-chip {
    display:flex; align-items:center; gap:7px;
    padding:7px 14px;
    background:var(--crimson-dim); border:1px solid var(--crimson-border);
    border-radius:99px; text-decoration:none;
    font-family:var(--f-mono); font-size:0.59rem; font-weight:700;
    color:var(--crimson); text-transform:uppercase; letter-spacing:0.07em;
    transition:all 0.22s var(--ease);
}
.emergency-chip:hover { background:rgba(255,26,75,0.18); transform:translateY(-2px); }
.emergency-chip i { animation:pulse-ec 1.3s infinite; font-size:11px; }
@keyframes pulse-ec { 0%,100%{opacity:1;}50%{opacity:0.35;} }

/* ── SPINNER ──────────────────────────────────────────────── */
.fa-spin { animation:spin 0.75s linear infinite; display:inline-block; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── BOOT SEQUENCE OVERLAY ──────────────────────────────── */
#boot-overlay {
    position:fixed; inset:0; z-index:9999;
    background:var(--void);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:14px;
    transition:opacity 0.8s var(--ease), visibility 0.8s;
}
#boot-overlay.hidden { opacity:0; visibility:hidden; pointer-events:none; }
.boot-logo {
    width:72px; height:72px; border-radius:18px;
    overflow:hidden; border:2px solid var(--cyan-40);
    box-shadow:var(--cyan-glow);
    animation:logo-pulse 2s ease-in-out infinite;
}
.boot-logo img { width:100%;height:100%;object-fit:contain; }
.boot-text {
    font-family:var(--f-mono); font-size:0.65rem; color:var(--cyan);
    letter-spacing:0.2em; text-transform:uppercase;
    animation:boot-type 0.1s steps(1) infinite;
}
@keyframes boot-type { 50%{opacity:0.4;} }
.boot-lines {
    display:flex; flex-direction:column; gap:4px;
    font-family:var(--f-mono); font-size:0.56rem; color:var(--tx3);
    letter-spacing:0.06em; text-align:left; width:260px;
}
.boot-line { opacity:0; animation:boot-line-in 0.3s var(--ease) forwards; }
.boot-line.ok::before { content:'[OK] '; color:var(--emerald); }
.boot-line.warn::before { content:'[··] '; color:var(--amber); }
.boot-bar-wrap {
    width:260px; height:2px; background:var(--b2); border-radius:1px;
    overflow:hidden;
}
.boot-bar-fill {
    height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--indigo));
    border-radius:1px; animation:boot-fill 2s var(--ease) forwards;
    box-shadow:0 0 8px var(--cyan);
}
@keyframes boot-fill { 0%{width:0} 70%{width:85%} 100%{width:100%} }
@keyframes boot-line-in { from{opacity:0;transform:translateX(-6px);}to{opacity:1;transform:translateX(0);} }

/* ── RESPONSIVE ───────────────────────────────────────────── */
@media (max-width:520px) {
    .card-body   { padding:28px 22px 30px; }
    .card-footer { padding:16px 22px 18px; flex-direction:column; align-items:flex-start; gap:8px; }
    .id-name     { font-size:1.3rem; }
    .id-logo-img { width:52px; height:52px; }
    .id-logo-wrap { width:52px; height:52px; }
    .scan-ring { inset:-6px; border-radius:20px; }
    .identity-bar{ gap:12px; margin-bottom:20px; }
    .input-wrapper input { font-size:16px; }
    #top-nav { padding:10px 14px; }
    .nav-status-pill { display:none; }
}

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--b3); border-radius:3px; }
    </style>
</head>

<body>

<!-- ── BOOT SEQUENCE OVERLAY ─────────────────────────── -->
<div id="boot-overlay">
    <div class="boot-logo">
        <img src="logo.png" alt="CIEPD" />
    </div>
    <div class="boot-text">CIEPD // INITIALIZING…</div>
    <div class="boot-lines" id="bootLines"></div>
    <div class="boot-bar-wrap">
        <div class="boot-bar-fill"></div>
    </div>
</div>

<!-- ── MATRIX RAIN ───────────────────────────────────── -->
<canvas id="matrix-canvas"></canvas>

<!-- ── SCAN LINE ─────────────────────────────────────── -->
<div id="scan-line"></div>

<!-- ── BACKGROUND ───────────────────────────────────── -->
<div id="bg-canvas">
    <video autoplay muted loop playsinline id="bg-video">
        <source src="videos/vid.mp4" type="video/mp4">
    </video>
    <div id="bg-scanlines"></div>
    <div id="bg-grid"></div>
    <div class="bg-orb o1"></div>
    <div class="bg-orb o2"></div>
    <div class="bg-orb o3"></div>
    <div id="bg-vignette"></div>
</div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- ── TOP NAV ───────────────────────────────────────── -->
<nav id="top-nav">
    <a href="index.html" class="nav-home-btn">
        <i class="fas fa-home"></i>
        <span>Home</span>
    </a>
    <div class="nav-right">
        <div class="nav-status-pill">
            <span class="nav-status-dot"></span>
            System Online
        </div>
        <button id="themeBtn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle theme">
            <i class="fas fa-sun"></i>
        </button>
    </div>
</nav>

<!-- ── MAIN CARD ─────────────────────────────────────── -->
<div id="page-wrap">

    <!-- IDENTITY -->
    <div class="identity-bar">
        <div class="id-logo-wrap">
            <div class="scan-ring"></div>
            <div class="scan-dot tl"></div>
            <div class="scan-dot tr"></div>
            <div class="scan-dot bl"></div>
            <div class="scan-dot br"></div>
            <div class="id-logo-img">
                <img src="logo.png" alt="CIEPD Logo" />
            </div>
        </div>
        <div>
            <div class="id-name">CIEPD</div>
            <div class="id-tagline">Conflict Intelligence Portal</div>
        </div>
    </div>

    <div class="glass-card">
        <div class="card-accent"></div>

        <div class="card-body">

            <!-- CLEARANCE HEADER -->
            <div class="clearance-header">
                <div class="clearance-badge">
                    <span class="clearance-badge-dot"></span>
                    Restricted Access
                </div>
                <div class="clearance-title">Administrator Portal</div>
                <div class="clearance-sub">Authorised Personnel Only · Niger Delta CWC</div>
            </div>

            <!-- STATUS PILL -->
            <div class="sys-pill">
                <span class="sys-dot"></span>
                System Online &nbsp;·&nbsp; 24/7 Monitoring Active
            </div>

            <!-- MESSAGE BOX -->
            <div id="message-box">
                <i id="msg-icon" class="fas fa-info-circle"></i>
                <span id="msg-text"></span>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form">
                <div class="input-group">
                    <label for="loginEmail">
                        Administrator Email
                        <span class="lbl-line"></span>
                    </label>
                    <div class="input-wrapper">
                        <i class="ico fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="admin@ciepd.org" autocomplete="email" required/>
                    </div>
                </div>
                <div class="input-group">
                    <label for="loginPassword">
                        Secure Passphrase
                        <span class="lbl-line"></span>
                    </label>
                    <div class="input-wrapper">
                        <i class="ico fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••••••" autocomplete="current-password" required/>
                        <span class="pw-eye" onclick="togglePw('loginPassword',this)" title="Show/hide">
                            <i class="fas fa-eye"></i>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn-submit" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Access Intelligence Portal
                </button>
            </form>

            <div class="help-row">
                <i class="fas fa-info-circle"></i>
                Contact your system administrator for access issues
            </div>

        </div><!-- /card-body -->

        <!-- FOOTER STRIP -->
        <div class="card-footer">
            <div class="ft-item"><i class="fas fa-shield-alt"></i> Encrypted Access</div>
            <div class="ft-item"><i class="fas fa-lock"></i> Secure Portal</div>
            <a href="tel:08034559689" class="emergency-chip">
                <i class="fab fa-whatsapp"></i> 08034559689
            </a>
        </div>

    </div><!-- /glass-card -->
</div><!-- /page-wrap -->


<script>
/* ═══════════════════════════════════════════════
   BOOT SEQUENCE
═══════════════════════════════════════════════ */
const bootMessages = [
    { cls:'ok',   text:'CIEPD Core Systems… Online' },
    { cls:'ok',   text:'Intelligence Database… Connected' },
    { cls:'ok',   text:'Encryption Layer… Active' },
    { cls:'warn', text:'Verifying Credentials… Standby' },
    { cls:'ok',   text:'Command Interface… Ready' },
];
(function runBoot() {
    const container = document.getElementById('bootLines');
    let i = 0;
    function nextLine() {
        if (i >= bootMessages.length) {
            setTimeout(() => document.getElementById('boot-overlay').classList.add('hidden'), 400);
            return;
        }
        const el = document.createElement('div');
        el.className = 'boot-line ' + bootMessages[i].cls;
        el.style.animationDelay = '0s';
        el.textContent = bootMessages[i].text;
        container.appendChild(el);
        i++;
        setTimeout(nextLine, 300);
    }
    setTimeout(nextLine, 200);
})();

/* ═══════════════════════════════════════════════
   MATRIX RAIN
═══════════════════════════════════════════════ */
(function initMatrix() {
    const canvas = document.getElementById('matrix-canvas');
    const ctx    = canvas.getContext('2d');
    let W, H, cols, drops;
    const chars  = '01アイウエオカキクケコサシスセソNIGERDELTACIEPD';

    function resize() {
        W = canvas.width  = window.innerWidth;
        H = canvas.height = window.innerHeight;
        cols = Math.floor(W / 16);
        drops = new Array(cols).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);

    function draw() {
        const isDark = document.documentElement.classList.contains('dark');
        ctx.fillStyle = isDark ? 'rgba(4,6,10,0.06)' : 'rgba(232,238,248,0.06)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = isDark ? 'rgba(0,240,255,0.75)' : 'rgba(0,91,204,0.5)';
        ctx.font = '13px JetBrains Mono, monospace';
        for (let i = 0; i < cols; i++) {
            const ch = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillText(ch, i * 16, drops[i] * 16);
            if (drops[i] * 16 > H && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 55);
})();

/* ═══════════════════════════════════════════════
   THEME
═══════════════════════════════════════════════ */
function toggleTheme() {
    document.documentElement.classList.toggle('dark');
    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    updateThemeIcon();
}
function updateThemeIcon() {
    const icon = document.querySelector('#themeBtn i');
    icon.className = document.documentElement.classList.contains('dark') ? 'fas fa-sun' : 'fas fa-moon';
}
updateThemeIcon();

/* ═══════════════════════════════════════════════
   PASSWORD TOGGLE
═══════════════════════════════════════════════ */
function togglePw(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon  = btn.querySelector('i');
    if (input.type === 'password') {
        input.type     = 'text';
        icon.className = 'fas fa-eye-slash';
    } else {
        input.type     = 'password';
        icon.className = 'fas fa-eye';
    }
}

/* ═══════════════════════════════════════════════
   MESSAGES
═══════════════════════════════════════════════ */
function showMessage(text, type = 'error') {
    const box  = document.getElementById('message-box');
    const txt  = document.getElementById('msg-text');
    const icon = document.getElementById('msg-icon');
    txt.textContent = text;
    box.className   = `show msg-${type}`;
    icon.className  = `fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}`;
}
function hideMessage() {
    document.getElementById('message-box').className = '';
}

/* ═══════════════════════════════════════════════
   BUTTON LOADING
═══════════════════════════════════════════════ */
function setLoading(isLoading) {
    const btn = document.getElementById('login-btn');
    btn.disabled = isLoading;
    btn.innerHTML = isLoading
        ? `<i class="fas fa-circle-notch fa-spin"></i> Authenticating…`
        : `<i class="fas fa-sign-in-alt"></i> Access Intelligence Portal`;
}

 /* ── BASE URL ── */
    const BASE_URL =
        window.location.hostname === "localhost" ||
        window.location.hostname === "127.0.0.1"
            ? "http://localhost:3000"
            : "";

/* ═══════════════════════════════════════════════
   LOGIN SUBMIT
═══════════════════════════════════════════════ */
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    hideMessage();

    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    if (!email || !password) {
        showMessage('Please enter your email and password.');
        return;
    }

    setLoading(true);

    try {
        const res = await fetch(`${BASE_URL}/api/login`, {
            method:      'POST',
            headers:     { 'Content-Type': 'application/json' },
            credentials: 'include',
            body:        JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (res.ok && data.success) {
            if (data.user && data.user.role) {
                localStorage.setItem('userRole', data.user.role);
            }
            showMessage('Authentication successful. Redirecting…', 'success');
            setTimeout(() => {
                window.location.href = data.redirect || 'admin.html';
            }, 900);
        } else {
            showMessage(data.error || data.message || 'Authentication failed. Check your credentials.');
        }

    } catch (err) {
        console.error('Fetch Error:', err);
        showMessage('⚠️ Server connection failed. Please try again.');
    } finally {
        setLoading(false);
    }
});
</script>

</body>
