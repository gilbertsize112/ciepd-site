<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIEPD Login Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        /* Base Styling */
        :root {
            --primary-color: #2575fc; /* Rich Blue */
            --primary-dark: #0053b3;
            --text-dark: #333;
            --border-color: #e0e6ed;
            --error-color: #e74c3c;
            --success-color: #27ae60;
        }

        * {
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url("loginbg.jpg") no-repeat center center / cover;
            position: relative;
            color: var(--text-dark);
        }

        /* Background shapes - (Kept your existing beautiful background animation) */
        .shape { position: absolute; border-radius: 50%; opacity: 0.25; animation: float 25s linear infinite; }
        .shape.small { width: 50px; height: 50px; }
        .shape.medium { width: 100px; height: 100px; }
        .shape.large { width: 150px; height: 150px; }

        @keyframes float {
            0% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(180deg); }
            100% { transform: translateY(0) rotate(360deg); }
        }
        /* End Background shapes */

        .container {
            background: rgba(255, 255, 255, 0.95); /* Slightly less transparent */
            border-radius: 15px; /* Slightly softer corners */
            width: 100%;
            max-width: 440px; /* Slightly wider */
            padding: 40px 35px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); /* Deeper shadow */
            position: relative;
            z-index: 1;
            animation: fadeIn 1s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Branding */
        .branding-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
        }
        .branding-header i {
            font-size: 32px;
            color: var(--primary-color);
            margin-right: 10px;
        }
        h1 { 
            font-size: 1.8rem; 
            color: var(--primary-dark); 
            margin: 0; 
            font-weight: 700;
        }
        p.subtitle { 
            font-size: 0.9rem; 
            color: #7f8c8d; 
            margin-bottom: 25px; 
            margin-top: 5px;
            text-align: center;
        }

        /* Tabs */
        .tabs { display: flex; justify-content: space-around; margin-bottom: 25px; border-bottom: 2px solid var(--border-color); }
        .tab {
            padding: 12px 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            color: #7f8c8d;
            transition: 0.2s;
            border-bottom: 3px solid transparent; /* Increased thickness */
        }
        .tab.active { color: var(--primary-color); border-color: var(--primary-color); }

        /* Forms */
        form { display: none; text-align: left; animation: fadeIn 0.5s ease; }
        form.active { display: block; }

        .input-group { margin-bottom: 18px; position: relative; } /* Added relative position */
        label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 5px; text-transform: uppercase; color: #555; }

        /* Input with Icon */
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 12px 15px 12px 40px; /* Adjusted padding for icon */
            border: 1px solid var(--border-color);
            border-radius: 8px; /* Softer corners */
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
        }

        .input-group i { /* Style for Font Awesome icons */
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            z-index: 2;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37,117,252,0.25);
        }

        /* Buttons */
        button {
            width: 100%;
            padding: 14px; /* Increased padding */
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover { background: var(--primary-dark); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        button:disabled { background: #95a5a6; cursor: not-allowed; }

        /* Message Box Styling */
        #message-box {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none; /* Hidden by default */
        }
        .msg-error { background-color: #fcebeb; color: var(--error-color); border: 1px solid var(--error-color); }
        .msg-success { background-color: #e8fce8; color: var(--success-color); border: 1px solid var(--success-color); }


        .footer { margin-top: 25px; font-size: 0.8rem; color: #666; text-align: center; }
    </style>
</head>

<body>

    <div class="shape small" style="top:10%; left:15%; background:#ff6b6b;"></div>
    <div class="shape medium" style="top:70%; left:75%; background:#ffca3a;"></div>
    <div class="shape large" style="top:50%; left:50%; background:#6bcB77;"></div>
    <div class="shape medium" style="top:20%; left:80%; background:#4d96ff;"></div>
    <div class="shape small" style="top:80%; left:20%; background:#ff6b6b;"></div>

    <div class="container">
        <div class="branding-header">
            <i class="fas fa-satellite-dish"></i>
            <h1>CIEPD Watch Center</h1>
        </div>
        <p class="subtitle">Access your administrative and monitoring tools</p>

        <div class="tabs">
            <div class="tab active" data-tab-id="login" onclick="showTab('login', this)">Login</div>
            <div class="tab" data-tab-id="signup" onclick="showTab('signup', this)">Sign Up</div>
            <div class="tab" data-tab-id="reset" onclick="showTab('reset', this)">Reset</div>
        </div>
        
        <div id="message-box"></div>

        <form id="login" class="active">
            <div class="input-group">
                <label for="loginEmail"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="loginEmail" placeholder="admin@ciepd.org" required />
            </div>
            <div class="input-group">
                <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required />
            </div>
            <button type="submit" id="login-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>

        <form id="signup">
            <div class="input-group">
                <label for="signupName"><i class="fas fa-user"></i> Full Name</label>
                <input type="text" id="signupName" placeholder="John Doe" required />
            </div>

            <div class="input-group">
                <label for="signupEmail"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="signupEmail" placeholder="Your work email" required />
            </div>

            <div class="input-group">
                <label for="signupPassword"><i class="fas fa-key"></i> Password</label>
                <input type="password" id="signupPassword" placeholder="Create a secure password" required />
            </div>

            <button type="submit" id="signup-btn"><i class="fas fa-user-plus"></i> Create Account</button>
        </form>

        <form id="reset">
            <div class="input-group">
                <label for="resetEmail"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="resetEmail" placeholder="Confirm your email" required />
            </div>

            <div class="input-group">
                <label for="resetNewPassword"><i class="fas fa-unlock"></i> New Password</label>
                <input type="password" id="resetNewPassword" placeholder="Enter new password" required />
            </div>

            <button type="submit" id="reset-btn"><i class="fas fa-redo-alt"></i> Reset Password</button>
        </form>

        <div class="footer">
            <p>Report incidents via SMS/WhatsApp: <strong>08034559689</strong></p>
        </div>
    </div>

    <script>
        /* 🔥 Correct backend auto-detection (fixed 100%) */
        const BASE_URL =
            window.location.hostname === "localhost" ||
            window.location.hostname === "127.0.0.1"
                ? "http://localhost:3000"
                : "https://ciepd-backend.onrender.com";
        
        const messageBox = document.getElementById('message-box');

        function showTab(tabId, element) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('form').forEach(form => form.classList.remove('active'));
            element.classList.add('active');
            document.getElementById(tabId).classList.add('active');
            messageBox.style.display = 'none'; // Clear message on tab switch
        }

        function showMessage(msg, type = 'error') {
            messageBox.textContent = msg;
            messageBox.className = '';
            messageBox.classList.add(type === 'success' ? 'msg-success' : 'msg-error');
            messageBox.style.display = 'block';
        }

        function toggleButtonLoading(btnId, isLoading, defaultText, iconClass) {
            const btn = document.getElementById(btnId);
            btn.disabled = isLoading;
            if (isLoading) {
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Processing...`;
            } else {
                btn.innerHTML = `<i class="${iconClass}"></i> ${defaultText}`;
            }
        }
        
        // --- LOGIN LOGIC ---
        document.getElementById("login").addEventListener("submit", async (e) => {
            e.preventDefault();
            messageBox.style.display = 'none';
            toggleButtonLoading('login-btn', true, 'Login', 'fas fa-sign-in-alt');

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value.trim();

            try {
                const res = await fetch(`${BASE_URL}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    credentials: "include",
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    window.location.href = data.redirect || "admin.html";
                } else {
                    showMessage(data.error || data.message || "Invalid credentials. Please try again.");
                }

            } catch (err) {
                console.error(err);
                showMessage("Connection Error: Unable to reach the server.");
            } finally {
                toggleButtonLoading('login-btn', false, 'Login', 'fas fa-sign-in-alt');
            }
        });

        // --- SIGNUP LOGIC ---
        document.getElementById("signup").addEventListener("submit", async (e) => {
            e.preventDefault();
            messageBox.style.display = 'none';
            toggleButtonLoading('signup-btn', true, 'Create Account', 'fas fa-user-plus');

            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value.trim();

            try {
                // NOTE: Assuming your backend has a /signup route, which it might not yet.
                const res = await fetch(`${BASE_URL}/signup`, { 
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage("Account created successfully! You can now log in.", 'success');
                    showTab("login", document.querySelector('[data-tab-id="login"]'));
                } else {
                    showMessage(data.message || "Signup failed. Account may already exist.");
                }

            } catch (err) {
                console.error(err);
                showMessage("Connection Error: Failed to create account.");
            } finally {
                toggleButtonLoading('signup-btn', false, 'Create Account', 'fas fa-user-plus');
            }
        });

        // --- RESET LOGIC ---
        document.getElementById("reset").addEventListener("submit", async (e) => {
            e.preventDefault();
            messageBox.style.display = 'none';
            toggleButtonLoading('reset-btn', true, 'Reset Password', 'fas fa-redo-alt');

            const email = document.getElementById("resetEmail").value.trim();
            const newPassword = document.getElementById("resetNewPassword").value.trim();

            try {
                // NOTE: Assuming your backend has a /reset-password route, which it might not yet.
                const res = await fetch(`${BASE_URL}/reset-password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, newPassword })
                });

                const data = await res.json();

                if (res.ok) {
                    showMessage("Password updated successfully! You can now log in.", 'success');
                    showTab("login", document.querySelector('[data-tab-id="login"]'));
                } else {
                    showMessage(data.message || "Password reset failed. Email not found.");
                }

            } catch (err) {
                console.error(err);
                showMessage("Connection Error: Failed to reset password.");
            } finally {
                toggleButtonLoading('reset-btn', false, 'Reset Password', 'fas fa-redo-alt');
            }
        });
    </script>

</body>
</html>
