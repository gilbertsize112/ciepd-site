<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CIEPD Conflict/Peace Watch Center</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* BASE STYLES */
        :root {
            --primary-color: #004d99; /* Deep Blue - for buttons/accents */
            --secondary-color: #f0f4f8; /* Very Light Blue/Grey - for backgrounds */
            --text-dark: #1f2937; /* Dark Grey - for body text */
            --text-light: #4b5563; /* Medium Grey */
            --header-bg: rgba(255, 255, 255, 0.85); /* Semi-transparent White */
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            /* Background image and fixed attachment for a subtle parallax feel */
            background: var(--secondary-color) url('contact.jpg') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-dark);
            line-height: 1.6;
        }

        a { 
            text-decoration: none; 
            color: var(--primary-color); 
            font-weight: 600; 
            transition: color 0.3s ease;
        }
        a:hover { 
            color: #007bff; /* Brighter blue on hover */
            text-decoration: none; 
        }

        /* HEADER & NAVIGATION */
        header {
            width: 100%;
            padding: 15px 40px;
            position: sticky;
            top: 0;
            z-index: 5000;
            /* Enhanced Glassmorphism */
            backdrop-filter: blur(16px);
            background: var(--header-bg);
            border-bottom: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .header-inner {
            max-width: 1400px;
            margin: auto;
            display: flex;
            justify-content: space-between; /* Align logo and nav */
            align-items: center;
            flex-wrap: wrap;
        }

        .site-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            text-align: left;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 18px;
            padding: 0;
            margin: 0;
        }

        nav ul li a {
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: var(--text-light);
        }

        nav ul li a:hover {
            background: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 77, 153, 0.3); /* Shadow matching primary color */
            transform: translateY(-1px);
        }
        
        /* MOBILE NAVIGATION ADJUSTMENT */
        @media (max-width: 900px) {
            .header-inner {
                flex-direction: column;
                gap: 15px;
            }
            nav ul {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
            }
            nav ul li a {
                font-size: 14px;
                padding: 6px 10px;
            }
        }
        
        /* INFO BAR */
        #info-line {
            background: white;
            padding: 12px 40px;
            text-align: center;
            border-bottom: 2px solid var(--secondary-color);
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        @media (max-width: 600px) {
            #info-line {
                padding: 10px 20px;
                font-size: 14px;
                line-height: 18px;
            }
        }

        /* MAP */
        .map-wrapper {
            text-align: center;
            padding: 50px 20px 0;
        }

        .map-wrapper img {
            width: 100%;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid white; /* Adds a nice frame */
            transition: transform 0.3s ease;
        }

        /* CONTACT BOX & FORM */
        .contact {
            background: white; /* Changed to solid white for better contrast against background image */
            padding: 50px;
            margin: 50px auto;
            max-width: 700px; /* Reduced max-width for better focus */
            border-radius: 16px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
            animation: slideInUp 0.7s ease-out;
        }

        @media (max-width: 768px) {
            .contact {
                padding: 30px;
                margin: 30px 20px;
            }
        }

        .contact h1 {
            text-align: center;
            color: var(--primary-color);
            font-size: 30px;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 10px;
        }

        .contact-label {
            display: block;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            margin: 15px 0 8px;
        }

        input.text,
        textarea.textarea {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 16px;
            background: #f9fafb;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box; /* Include padding/border in element's total width/height */
        }
        
        input.text:focus,
        textarea.textarea:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0, 77, 153, 0.2);
            outline: none;
        }
        
        textarea.textarea {
            resize: vertical;
        }

        .btn_submit {
            background: var(--primary-color);
            color: #fff;
            padding: 16px;
            width: 100%;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 700;
            margin-top: 25px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .btn_submit:hover {
            background: #003a7a; /* Darker shade on hover */
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 77, 153, 0.4);
        }

        /* FLOATING BUTTONS */
        .float-btn {
            position: fixed;
            bottom: 30px;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            transition: transform 0.2s ease, box-shadow 0.3s ease;
        }
        
        .float-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .whatsapp-float {
            right: 30px;
            background: #25D366;
            font-size: 30px;
            padding: 18px;
            border-radius: 50%;
            width: 30px; /* Ensures circular shape */
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-float {
            left: 30px;
            background: var(--primary-color);
            padding: 14px 25px;
            border-radius: 50px;
            font-size: 16px;
        }

        /* MOBILE FLOAT BUTTON FIX */
        @media (max-width: 600px) {
            .float-btn {
                bottom: 20px;
            }
            .whatsapp-float {
                right: 20px;
                font-size: 24px;
                padding: 14px;
                width: 24px;
                height: 24px;
            }
            .submit-float {
                left: 20px;
                padding: 10px 18px;
                font-size: 14px;
            }
        }

        /* FOOTER */
        #footer {
            background: var(--text-dark);
            color: #ccc;
            text-align: center;
            padding: 30px;
            font-size: 14px;
            margin-top: 50px;
        }
        
        #footer a {
            color: #fff;
        }
        
        /* KEYFRAME ANIMATIONS */
        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <div class="site-title">
                CIEPD Conflict/Peace Watch Center
            </div>

            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="report.html">Reports</a></li>
                    <li><a href="submit.html">Submit a Report</a></li>
                    <li><a href="getalert.html">Get Alerts</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                    <li><a href="admin-map.html">Big Map</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div id="info-line">
        <i class="fas fa-phone-alt"></i> WhatsApp/SMS: **08034559689** |
        <span class="submit-incident"><a href="submit.html">Submit a Confidential Report Now</a></span>
    </div>

    <div class="map-wrapper">
        <img src="Nigerdelta.jpg" alt="Map showing the operational region of the Peace Watch Center">
    </div>

    <div class="contact">
        <h1><i class="far fa-envelope"></i> Send us a Message</h1>

        <form action="/submit-contact" method="post">

            <label class="contact-label" for="name">Your Name</label>
            <input type="text" id="name" class="text" name="name" placeholder="Enter your full name" required>

            <label class="contact-label" for="email">Your Email Address</label>
            <input type="email" id="email" class="text" name="email" placeholder="Enter your email" required>

            <label class="contact-label" for="phone">Your Phone Number (Optional)</label>
            <input type="text" id="phone" class="text" name="phone" placeholder="Enter your phone number">

            <label class="contact-label" for="subject">Message Subject</label>
            <input type="text" id="subject" class="text" name="subject" placeholder="What is your message about?" required>

            <label class="contact-label" for="message">Message</label>
            <textarea id="message" class="textarea" name="message" rows="6" placeholder="Type your message here..." required></textarea>

            <label class="contact-label" for="security">Security Code: What is $234 + 100$? (Solve to verify)</label>
            <input type="text" id="security" class="text" name="security" placeholder="Enter the answer here" required>

            <button type="submit" class="btn_submit">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>

    <a href="https://wa.me/2348034559689" class="whatsapp-float float-btn" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <a href="submit.html" class="submit-float float-btn">
        <i class="fas fa-bullhorn"></i> Submit a Report
    </a>

    <div id="footer">
        &copy; 2025 CIEPD Conflict/Peace Watch Center. All Rights Reserved. | <a href="#">Privacy Policy</a>
    </div>

</body>
</html>
