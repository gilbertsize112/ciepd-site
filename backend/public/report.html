<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // 1. INSTANT THEME CHECK (Prevents the white flash)
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const isDark = savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) document.documentElement.classList.add('dark');
        })();
    </script>
    <script src="theme.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CIEPD Conflict/Peace Watch Center - Reports</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* ---------------------------------------------------- */
        /* 1. COLOR PALETTE & GLOBAL RESET                      */
        /* ---------------------------------------------------- */
        :root {
            --primary: #0077b6;
            --secondary: #00b4d8;
            --accent: #023047;
            --muted: #6b7280;
            --danger: #e63946;
            --success: #06d6a0;
            --card: #ffffff;
            --bg-light: #f8feff;
            --radius: 16px;
            --border-light: #e6eef6;
            --text-dark: #333;
            --card-rgb: 255, 255, 255;
        }

        .dark {
            --accent: #e6f7ff;
            --muted: #a0a8b9;
            --card: #1f2a37;
            --bg-light: #121820;
            --border-light: #2c3e50;
            --text-dark: #e6f7ff;
            --card-rgb: 31, 42, 55;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: #000 !important;
            color: var(--text-dark);
            min-height: 100vh;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        /* ⭐ VIDEO BACKGROUND ⭐ */
        #video-background {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -200;
            object-fit: cover;
            filter: brightness(35%);
        }
        .dark #video-background { filter: brightness(20%); }

        #content-wrapper { position: relative; z-index: 10; min-height: 100vh; }

        /* ---------------------------------------------------- */
        /* 2. HEADER AND NAVIGATION                             */
        /* ---------------------------------------------------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(var(--card-rgb), 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .brand {
            font-weight: 800;
            color: var(--primary);
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .scroll-container {
            width: 150px;
            overflow: hidden;
            white-space: nowrap;
            font-size: 12px;
            font-weight: 600;
        }
        
        @media (min-width: 768px) {
            .brand { font-size: 22px; }
            .scroll-container { width: 350px; font-size: 14px; }
        }

        .scroll-text {
            display: inline-block;
            padding-left: 100%;
            animation: scroll-left 20s linear infinite;
            color: var(--primary);
        }
        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        #darkModeToggle {
            background: var(--primary);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-bar {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: rgba(var(--card-rgb), 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-light);
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        .nav-bar::-webkit-scrollbar { display: none; }

        .nav-bar a {
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 50px;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 13px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid transparent;
        }
        .nav-bar a:hover, .nav-bar a.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 119, 182, 0.3);
        }

        /* ---------------------------------------------------- */
        /* 3. MAIN CONTAINER & STATS                            */
        /* ---------------------------------------------------- */
        .container {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
            background: rgba(var(--card-rgb), 0.9);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 25px;
        }
        
        .stat-box {
            padding: 15px;
            border-radius: 12px;
            background: var(--card);
            border: 1px solid var(--border-light);
            text-align: center;
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .filters {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .filters { flex-direction: row; }
            .filters input, .filters select { flex: 1; }
        }

        .filters input, .filters select {
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            background: var(--card);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .filters input:focus { border-color: var(--primary); }

        /* ---------------------------------------------------- */
        /* 4. REPORT GRID & CARDS                               */
        /* ---------------------------------------------------- */
        .report-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            gap: 15px;
        }

        @media (min-width: 600px) {
            .report-grid { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        }

        .report-card {
            background: var(--card);
            padding: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border-light);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        .report-card:active { transform: scale(0.98); }

        .report-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: block;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .status {
            align-self: flex-start;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 800;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .verified { background: var(--success); }
        .unverified { background: var(--danger); }

        .pagination {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            font-weight: 600;
        }
        
        .pagination button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: opacity 0.3s;
        }
        .pagination button:active { opacity: 0.7; }

    </style>
</head>
<body>

<video autoplay muted loop playsinline id="video-background">
    <source src="videos/vid.mp4" type="video/mp4">
</video>

<div id="content-wrapper">
    <header class="header">
        <div class="brand">
            <i class="fas fa-shield-alt"></i> <span>CIEPD Reports</span>
        </div>
        <div style="display: flex; align-items: center;">
            <div class="scroll-container">
                <div class="scroll-text">Monitoring Peace and Security Across Nigeria • Live Updates • CIEPD Conflict Watch</div>
            </div>
            <button id="darkModeToggle">
                <i class="fas fa-sun"></i>
            </button>
        </div>
    </header>

    <nav class="nav-bar">
        <a href="home.html"><i class="fas fa-home"></i> Home</a>
        <a href="report.html" class="active"><i class="fas fa-clipboard-list"></i> Reports</a>
        <a href="submit.html"><i class="fas fa-plus-circle"></i> Submit</a>
        <a href="getalert.html"><i class="fas fa-bell"></i> Get Alerts</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
        <a href="hatealert.html"><i class="fas fa-exclamation-triangle"></i> Hate Alerts</a>
    </nav>

    <div class="container">
        <div class="stats">
            <div class="stat-box" id="total-count">Total: 0</div>
            <div class="stat-box" id="verified-count">Verified: 0</div>
            <div class="stat-box" id="unverified-count">Unverified: 0</div>
        </div>

        <div class="filters">
            <input id="search-input" type="text" placeholder="🔍 Search reports...">
            <select id="category-filter">
                <option value="">All Categories</option>
            </select>
        </div>

        <div class="report-grid" id="report-grid"></div>
        <div class="pagination" id="pagination"></div>
    </div>
</div>

<script>
let allReports = [];
let currentPage = 1;
const perPage = 12;

/* DARK MODE LOGIC */
const darkModeToggle = document.getElementById('darkModeToggle');
function updateThemeIcon() {
    const icon = darkModeToggle.querySelector('i');
    if(document.documentElement.classList.contains('dark')) {
        icon.classList.replace('fa-sun', 'fa-moon');
    } else {
        icon.classList.replace('fa-moon', 'fa-sun');
    }
}
updateThemeIcon();

darkModeToggle.addEventListener('click', () => {
    document.documentElement.classList.toggle('dark');
    const isDark = document.documentElement.classList.contains('dark');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon();
});

/* LOAD DATA */
loadReports();
setInterval(loadReports, 30000);

async function loadReports() {
    try {
        const res = await fetch("/api/news?limit=5000&page=1"); 
        const data = await res.json();
        if (!data.items) return;

        const seen = new Set();
        allReports = data.items.filter(r => {
            const key = r._id || r.id;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });

        allReports.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        updateStats(allReports);
        populateCategoryDropdown(allReports);
        displayReports();
    } catch (e) { console.error(e); }
}

function updateStats(data) {
    let verified = data.filter(n => n.verified).length;
    document.getElementById("total-count").innerText = "Total: " + data.length;
    document.getElementById("verified-count").innerText = "Verified: " + verified;
    document.getElementById("unverified-count").innerText = "Unverified: " + (data.length - verified);
}

function populateCategoryDropdown(data) {
    const categories = new Set();
    data.forEach(r => { if (Array.isArray(r.categories)) r.categories.forEach(c => categories.add(c)); });
    const dropdown = document.getElementById("category-filter");
    const currentVal = dropdown.value;
    dropdown.innerHTML = `<option value="">All Categories</option>`;
    categories.forEach(c => { dropdown.innerHTML += `<option value="${c}" ${currentVal === c ? 'selected' : ''}>${c}</option>`; });
}

function displayReports() {
    const grid = document.getElementById("report-grid");
    grid.innerHTML = "";
    const search = document.getElementById("search-input").value.toLowerCase();
    const cat = document.getElementById("category-filter").value;

    const filtered = allReports.filter(r => {
        const titleMatch = r.title?.toLowerCase().includes(search);
        const catMatch = cat === "" || (Array.isArray(r.categories) && r.categories.includes(cat));
        return titleMatch && catMatch;
    });

    const paginated = filtered.slice((currentPage - 1) * perPage, currentPage * perPage);

    if(paginated.length === 0) {
        grid.innerHTML = `<div style="text-align:center; grid-column: 1/-1; padding: 40px; color: var(--muted);">No reports found.</div>`;
    }

    paginated.forEach(report => {
        grid.innerHTML += `
            <div class="report-card">
                <div>
                    <a class="report-title" href="newsdetail.html?id=${report._id || report.id}">
                        ${report.title}
                    </a>
                    <div style="font-size:13px; color:var(--muted); margin-bottom:12px; font-weight: 500;">
                        <i class="fas fa-map-marker-alt" style="color: var(--primary)"></i> ${report.location || "Nigeria"}
                    </div>
                </div>
                <span class="status ${report.verified ? "verified" : "unverified"}">
                    ${report.verified ? "<i class='fas fa-check-circle'></i> Verified" : "<i class='fas fa-clock'></i> Unverified"}
                </span>
            </div>
        `;
    });
    renderPagination(filtered.length);
}

function renderPagination(total) {
    const pages = Math.ceil(total / perPage);
    const pag = document.getElementById("pagination");
    pag.innerHTML = "";
    if (pages <= 1) return;
    
    if (currentPage > 1) pag.innerHTML += `<button onclick="currentPage--; displayReports(); scrollContainer();">Prev</button>`;
    pag.innerHTML += `<span>${currentPage} / ${pages}</span>`;
    if (currentPage < pages) pag.innerHTML += `<button onclick="currentPage++; displayReports(); scrollContainer();">Next</button>`;
}

function scrollContainer() {
    document.querySelector('.container').scrollIntoView({ behavior: 'smooth' });
}

document.getElementById("search-input").addEventListener("input", () => { currentPage = 1; displayReports(); });
document.getElementById("category-filter").addEventListener("change", () => { currentPage = 1; displayReports(); });
</script>
</body>
</html>
