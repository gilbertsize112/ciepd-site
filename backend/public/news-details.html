<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>News Details | CIEPD</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    /* ---------------------------------------------------- */
    /* 1. GLOBAL & LAYOUT STYLES */
    /* ---------------------------------------------------- */
    :root {
        --primary-blue: #0d47a1;
        --deep-blue: #1a237e;
        --accent-orange: #f0ad4e;
        --accent-green: #28a745;
        --text-main: #222222;
        --text-muted: #555555;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: #000; 
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
    }

    /* Video Container */
    #video-background {
        position: fixed; 
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%; 
        z-index: -200;
        object-fit: cover; 
        filter: brightness(25%); /* Darker for better text readability */
    }

    /* Content Wrapper */
    #content-wrapper {
        position: relative;
        z-index: 10;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Keyframe Animations */
    @keyframes fadeInScale {
        from { opacity: 0; transform: scale(0.98) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ---------------------------------------------------- */
    /* 2. HEADER & BACK BUTTON */
    /* ---------------------------------------------------- */

    .back-button {
        position: fixed;
        top: 20px;
        left: 20px;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(5px);
        color: var(--primary-blue);
        padding: 10px 20px;
        border-radius: 50px;
        font-weight: 700;
        font-size: 14px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 1000;
    }

    .back-button:active {
        transform: scale(0.9);
    }

    .hero {
        background: linear-gradient(180deg, rgba(13, 71, 161, 0.9) 0%, rgba(26, 35, 126, 0.6) 100%);
        padding: 80px 25px 50px;
        text-align: center;
        color: white;
        font-size: 32px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom-left-radius: 40px;
        border-bottom-right-radius: 40px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* ---------------------------------------------------- */
    /* 3. CARD AND CONTENT STYLES */
    /* ---------------------------------------------------- */
    .card {
        max-width: 900px;
        margin: -30px 15px 40px; /* Pulls card up into the hero */
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 25px;
        border-radius: 30px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        animation: fadeInScale 0.6s ease-out;
        align-self: center;
        width: calc(100% - 30px);
        box-sizing: border-box;
    }

    #loading {
        text-align: center;
        padding: 40px;
        font-weight: 600;
        color: var(--primary-blue);
    }

    .title {
        color: var(--primary-blue);
        font-size: 26px;
        font-weight: 800;
        margin-bottom: 10px;
        line-height: 1.25;
    }

    .meta {
        color: var(--text-muted);
        font-size: 13px;
        margin-bottom: 20px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .meta i { color: var(--primary-blue); }

    .image-container {
        width: 100%;
        margin-bottom: 25px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .image {
        width: 100%;
        height: auto;
        display: block;
        transition: transform 0.5s ease;
    }

    .content {
        line-height: 1.8;
        color: var(--text-main);
        font-size: 16px;
        white-space: pre-wrap;
        margin-bottom: 25px;
    }

    /* ---------------------------------------------------- */
    /* 4. TAGS AND ACTIONS STYLES */
    /* ---------------------------------------------------- */
    .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #eee;
    }

    .badge {
        background: #f0f4f8;
        padding: 8px 16px;
        border-radius: 12px;
        font-weight: 700;
        color: var(--primary-blue);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .actions {
        display: flex;
        gap: 12px;
    }

    .btn {
        flex: 1;
        padding: 16px;
        border-radius: 18px;
        border: 0;
        cursor: pointer;
        font-weight: 800;
        font-size: 15px;
        transition: all 0.3s ease;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        color: white;
    }

    .verify { background: var(--accent-orange); box-shadow: 0 4px 15px rgba(240, 173, 78, 0.3); }
    .approved { background: var(--accent-green); box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3); }

    .btn:disabled {
        background: #bdc3c7;
        box-shadow: none;
        opacity: 0.8;
        cursor: not-allowed;
    }

    /* ---------------------------------------------------- */
    /* 5. DESKTOP OPTIMIZATIONS */
    /* ---------------------------------------------------- */
    @media (min-width: 992px) {
        .hero { font-size: 48px; padding: 100px 25px 80px; }
        .card { padding: 40px; margin-top: -60px; }
        .title { font-size: 36px; }
        .content { font-size: 18px; }
        .actions { max-width: 400px; }
        .back-button:hover { background: white; transform: translateY(-2px); }
    }
</style>
</head>

<body>

<video autoplay muted loop playsinline id="video-background">
    <source src="videos/vid.mp4" type="video/mp4">
</video>

<div id="content-wrapper">

    <a href="report.html" class="back-button">
        <i class="fas fa-chevron-left"></i> <span>Back</span>
    </a>

    <div class="hero">Report Detail</div>

    <div class="card" id="card">
      <div id="loading"><i class="fas fa-circle-notch fa-spin"></i> Loading report...</div>

      <div id="content" style="display:none">
        <div class="title" id="title"></div>
        <div class="meta" id="meta"><i class="far fa-calendar-alt"></i> <span id="timestamp"></span></div>

        <div class="image-container">
            <img id="image" class="image" src="" alt="" style="display:none"/>
        </div>

        <div class="content" id="body"></div>

        <div class="tags">
          <span class="badge" id="category"><i class="fas fa-tag"></i></span>
          <span class="badge" id="location"><i class="fas fa-map-marker-alt"></i></span>
        </div>

        <div class="actions">
          <button id="verifyBtn" class="btn verify"><i class="fas fa-check-circle"></i> Verify</button>
          <button id="approveBtn" class="btn approved"><i class="fas fa-thumbs-up"></i> Approve</button>
        </div>
      </div>
    </div>

</div> 

<script>
function qs(key){
  const u = new URLSearchParams(location.search);
  return u.get(key);
}

const id = qs('id');

if(!id){
  document.getElementById('loading').innerHTML = '<i class="fas fa-exclamation-triangle"></i> No article selected. Redirecting...';
    setTimeout(() => {
        window.location.href = 'report.html'; 
    }, 2500);
}

async function load(){
    if (!id) return;

    try {
        const res = await fetch('/api/news/' + id);
        if(!res.ok){
            document.getElementById('loading').innerHTML = '<i class="fas fa-search"></i> Error: Article not found.';
            return;
        }

        const data = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Populate Text Content
        document.getElementById('title').innerText = data.title || 'Untitled Report';
        document.getElementById('timestamp').innerText = new Date(data.createdAt).toLocaleString();
        document.getElementById('body').innerText = data.content || data.description || 'No content provided.';

        // Image
        const img = document.getElementById('image');
        if(data.image){
            img.src = data.image;
            img.style.display = 'block';
        }

        // Tags
        document.getElementById('category').innerHTML += (data.categories && data.categories[0]) || 'General';
        document.getElementById('location').innerHTML += data.location || 'Unknown location';

        // Buttons Setup
        const verifyBtn = document.getElementById('verifyBtn');
        const approveBtn = document.getElementById('approveBtn');

        if(data.verified) {
            verifyBtn.innerHTML = '<i class="fas fa-check-double"></i> Verified';
            verifyBtn.disabled = true;
        }
        
        if(data.approved) {
            approveBtn.innerHTML = '<i class="fas fa-check-double"></i> Approved';
            approveBtn.disabled = true;
        }

        // VERIFY ACTION
        verifyBtn.addEventListener('click', async () => {
            const r = await fetch('/api/news/verify/' + id, { method: 'PUT' });
            if(r.ok){
                verifyBtn.innerHTML = '<i class="fas fa-check-double"></i> Verified';
                verifyBtn.disabled = true;
            }
        });

        // APPROVE ACTION
        approveBtn.addEventListener('click', async () => {
            const r = await fetch('/api/news/approve/' + id, { method: 'PUT' });
            if(r.ok){
                approveBtn.innerHTML = '<i class="fas fa-check-double"></i> Approved';
                approveBtn.disabled = true;
            }
        });

    } catch (err){
        document.getElementById('loading').innerText = 'Error: Connection failed.';
        console.error("Fetch error:", err);
    }
}

load();
</script>

</body>
</html>
