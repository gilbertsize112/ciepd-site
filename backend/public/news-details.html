<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>News Details</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
    /* ---------------------------------------------------- */
    /* 1. GLOBAL & LAYOUT STYLES */
    /* ---------------------------------------------------- */
    body {
        font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
        background: transparent; 
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
    }

    /* Video Container */
    #video-background {
        position: fixed; 
        right: 0;
        bottom: 0;
        min-width: 100%; 
        min-height: 100%; 
        z-index: -200;
        object-fit: cover; 
        filter: brightness(30%);
    }

    /* Content Wrapper (sits above the video) */
    #content-wrapper {
        position: relative;
        z-index: 10;
        min-height: 100vh;
    }

    /* Keyframe Animations */
    @keyframes fadeDown {
        from { opacity: 0; transform: translateY(-30px); }
        to  { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(20px); }
        to  { opacity: 1; transform: translateY(0); }
    }


    /* ---------------------------------------------------- */
    /* 2. HEADER & BACK BUTTON */
    /* ---------------------------------------------------- */

    /* Back Button */
    .back-button {
        position: absolute;
        top: 25px;
        left: 25px;
        text-decoration: none;
        background: rgba(255, 255, 255, 0.9);
        color: #0d47a1;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 16px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        transition: 0.25s;
        display: flex;
        align-items: center;
        gap: 8px;
        z-index: 100;
    }
    .back-button:hover {
        background: white;
        color: #1a237e;
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }
    .back-button i {
        font-size: 16px;
    }

    /* Hero/Header Section */
    .hero {
        background: linear-gradient(135deg, #0d47a1, #1a237e);
        padding: 55px 25px;
        text-align: center;
        color: white;
        font-size: 42px;
        font-weight: 800;
        letter-spacing: .5px;
        box-shadow: 0 4px 25px rgba(0,0,0,0.25);
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
        animation: fadeDown .9s ease-out;
        position: relative;
    }


    /* ---------------------------------------------------- */
    /* 3. CARD AND CONTENT STYLES */
    /* ---------------------------------------------------- */
    .card {
        max-width: 950px;
        margin: 40px auto;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(8px);
        padding: 30px;
        border-radius: 22px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        animation: fadeUp 0.9s ease-out;
    }

    .title {
        color: #0d47a1;
        font-size: 30px;
        font-weight: 800;
        margin-bottom: 12px;
        line-height: 1.3;
    }

    .meta {
        color: #555;
        font-size: 15px;
        margin-bottom: 20px;
        font-weight: 500;
    }

    .image {
        width: 100%;
        max-height: 480px;
        object-fit: cover;
        border-radius: 14px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        margin-bottom: 20px;
    }

    .content {
        line-height: 1.75;
        color: #222;
        font-size: 17px;
        white-space: pre-wrap;
        margin-bottom: 18px;
    }

    /* ---------------------------------------------------- */
    /* 4. TAGS AND ACTIONS STYLES */
    /* ---------------------------------------------------- */
    .tags {
        margin-top: 18px;
        margin-bottom: 18px;
    }

    .badge {
        display: inline-block;
        background: #eef7ff;
        padding: 7px 14px;
        border-radius: 999px;
        margin-right: 8px;
        font-weight: 600;
        color: #0d47a1;
        font-size: 13px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.06);
    }

    .actions {
        margin-top: 25px;
        display: flex;
        gap: 12px;
    }

    button {
        padding: 12px 22px;
        border-radius: 999px;
        border: 0;
        cursor: pointer;
        font-weight: 700;
        font-size: 15px;
        transition: .25s;
    }

    /* Verification Buttons */
    .verify {
        background: #f0ad4e; /* Orange */
        color: #fff;
    }
    .verify:hover {
        background: #e09635;
        transform: translateY(-3px);
    }

    .approved {
        background: #28a745; /* Green */
        color: #fff;
    }
    .approved:hover {
        background: #1e7c34;
        transform: translateY(-3px);
    }
    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
    }


    /* ---------------------------------------------------- */
    /* 5. MEDIA QUERIES (RESPONSIVENESS) */
    /* ---------------------------------------------------- */
    @media (max-width: 600px) {
        .back-button {
            top: 15px;
            left: 10px;
            padding: 8px 14px;
            font-size: 14px;
        }
        .hero {
            font-size: 32px;
            padding: 40px 15px;
        }
        .card {
            margin: 20px auto;
            padding: 20px;
        }
        .title {
            font-size: 24px;
        }
    }
</style>
</head>

<body>

<video autoplay muted loop id="video-background">
    <source src="videos/vid.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

<div id="content-wrapper">

    <a href="report.html" class="back-button">
        <i class="fas fa-arrow-left"></i> Back to Reports
    </a>

    <div class="hero">News Details</div>

    <div class="card" id="card">
      <div id="loading">Loading...</div>

      <div id="content" style="display:none">
        <div class="title" id="title"></div>
        <div class="meta" id="meta"></div>

        <img id="image" class="image" src="" alt="" style="display:none"/>

        <div class="content" id="body"></div>

        <div class="tags">
          <span class="badge" id="category"></span>
          <span class="badge" id="location"></span>
        </div>

        <div class="actions">
          <button id="verifyBtn" class="verify">Verify</button>
          <button id="approveBtn" class="approved">Approve</button>
        </div>
      </div>
    </div>

</div> <script>
/**
 * 1. Utility function to get a query string parameter from the URL.
 * (Defined first to prevent "red" editor errors)
 */
function qs(key){
  const u = new URLSearchParams(location.search);
  return u.get(key);
}

const id = qs('id');

if(!id){
  document.getElementById('loading').innerText = 'No article selected. Redirecting to reports...';
    // Optional: Redirect back after 3 seconds if ID is missing
    setTimeout(() => {
        window.location.href = 'report.html'; 
    }, 3000);
}

/**
 * 2. Loads news details from the API and populates the page.
 */
async function load(){
    if (!id) return;

    try {
        // NOTE: Ensure your API endpoint for fetching a single report is correct: /api/news/{id}
        const res = await fetch('/api/news/' + id);
        if(!res.ok){
            document.getElementById('loading').innerText = 'Error: Article not found (404).';
            return;
        }

        const data = await res.json();

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';

        // Populate Text Content
        document.getElementById('title').innerText = data.title || 'Untitled';
        document.getElementById('meta').innerText = new Date(data.createdAt).toLocaleString();
        document.getElementById('body').innerText = data.content || data.description || '';

        // Image
        const img = document.getElementById('image');
        if(data.image){
            img.src = data.image;
            img.style.display = 'block';
        } else {
            img.style.display = 'none';
        }

        // Tags
        document.getElementById('category').innerText = (data.categories && data.categories[0]) || 'General';
        document.getElementById('location').innerText = data.location || 'Unknown location';

        // Buttons Setup
        const verifyBtn = document.getElementById('verifyBtn');
        const approveBtn = document.getElementById('approveBtn');

        verifyBtn.textContent = data.verified ? 'Verified' : 'Verify';
        approveBtn.textContent = data.approved ? 'Approved' : 'Approve';

        verifyBtn.disabled = data.verified;
        approveBtn.disabled = data.approved;

        // VERIFY ACTION (Example API call)
        verifyBtn.addEventListener('click', async () => {
            if(verifyBtn.disabled) return; 
            const r = await fetch('/api/news/verify/' + id, { method: 'PUT' });
            if(r.ok){
                verifyBtn.textContent = 'Verified';
                verifyBtn.disabled = true;
            }
        });

        // APPROVE ACTION (Example API call)
        approveBtn.addEventListener('click', async () => {
            if(approveBtn.disabled) return;
            const r = await fetch('/api/news/approve/' + id, { method: 'PUT' });
            if(r.ok){
                approveBtn.textContent = 'Approved';
                approveBtn.disabled = true;
            }
        });

    } catch (err){
        document.getElementById('loading').innerText = 'Error: Could not connect to the API.';
        console.error("Fetch error:", err);
    }
}

load();
</script>

</body>
</html>
